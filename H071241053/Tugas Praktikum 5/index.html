<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantau Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="max-w-5xl mx-auto p-4 md:p-8">

    <header class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-indigo-700">Pemantau Tugas Tim</h1>
      <p class="text-slate-600">Pilih nama anggota untuk melihat tugas dan progresnya.</p>
    </header>

    <div class="grid gap-6 md:grid-cols-3">

      <!-- ===== F1: Daftar anggota ===== -->
      <section class="md:col-span-1 bg-white rounded-xl shadow p-4 h-fit">
        <h2 class="text-lg font-semibold mb-3">Anggota Tim</h2>
        <p id="status-anggota" class="text-sm text-slate-500">Memuat anggota...</p>
        <p id="error-anggota" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3"></p>
        <div id="daftar-anggota" class="flex flex-col gap-2"></div>
      </section>

      <!-- ===== F2-F5: Tugas anggota ===== -->
      <section class="md:col-span-2 bg-white rounded-xl shadow p-4">
        <h2 id="judul-tugas" class="text-lg font-semibold mb-3">Tugas</h2>

        <p id="pesan-awal" class="text-sm text-slate-500">Belum ada anggota yang dipilih.</p>
        <p id="status-tugas" class="hidden text-sm text-slate-500">Memuat tugas...</p>
        <p id="error-tugas" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3"></p>

        <div id="konten-tugas" class="hidden">
          <p id="ringkasan" class="font-medium text-indigo-700 mb-3"></p>

          <!-- F3: Pencarian -->
          <input id="input-cari" type="text" placeholder="Cari tugas berdasarkan judul..."
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400">

          <!-- F4: Form tambah tugas -->
          <form id="form-tugas" class="mb-2 flex flex-col gap-2 sm:flex-row" novalidate>
            <input id="input-judul" type="text" placeholder="Judul tugas baru..."
                   class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <button id="tombol-simpan" type="submit"
                    class="bg-indigo-600 text-white rounded-lg px-4 py-2 hover:bg-indigo-700 disabled:opacity-60">Simpan</button>
          </form>
          <p id="error-form" class="hidden text-sm text-red-700 mb-2"></p>
          <p id="notifikasi" class="hidden text-sm text-green-800 bg-green-50 border border-green-200 rounded-lg p-2 mb-2"></p>

          <p id="pesan-kosong" class="hidden text-sm text-slate-500 my-3"></p>
          <ul id="daftar-tugas" class="flex flex-col gap-2 mt-3"></ul>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
